[project]
name = "winclip"
version = "0.1.0"
description = "WinClip: pipeline local de clipping (API, CLI y worker)"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "typer>=0.15",
  "rich>=13.9",
  "httpx>=0.28",
  "huggingface-hub>=0.27",
]

[project.scripts]
winclip = "winclip.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["winclip"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: tests lentos (red, modelos o procesos externos)"]

[tool.uv]
package = true
